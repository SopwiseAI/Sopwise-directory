name: 功能建议
description: 建议新功能或改进现有体验
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: 建议内容
      description: 想解决什么问题？期望的使用方式是什么？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 是否考虑过其他做法？
  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交实现这个建议的 PR
