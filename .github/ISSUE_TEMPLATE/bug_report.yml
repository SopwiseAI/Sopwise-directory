name: 缺陷报告
description: 站点或工程中的问题（功能异常、显示错乱、构建失败等）
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 清晰描述问题现象、复现步骤与预期行为
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 期望 … 实际 …
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 相关页面 URL（如适用）
      placeholder: https://www.xigee.net/...
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 前端页面（web/）
        - 数据内容（web/data/topics.json / tools.json）
        - 构建 / 部署 / CI
        - studio 后端
        - 文档
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境信息（可选）
      description: 浏览器与版本、操作系统等
