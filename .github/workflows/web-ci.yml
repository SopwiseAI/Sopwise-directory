name: Web CI

# 注意：这里刻意不加 paths 过滤——main 已配置分支保护，要求 "ci" 检查通过才能合并，
# 如果只在 web/** 变更时运行，根目录/studio 的 PR 会永远等不到该检查而无法合并。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限：本工作流只读仓库内容（不发布、不提 PR、不写评论）
permissions:
  contents: read

# 同一分支/PR 的旧运行自动取消：既省 runner，也避免旧结果覆盖新结果
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 所有 action 按 commit SHA 固定（供应链要求，对应 OpenSSF Scorecard 的 Pinned-Dependencies），
      # 版本写在行尾注释里，由 Dependabot 的 github-actions 生态持续更新。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 暂留 v5：pnpm/action-setup v6 起要求 pnpm >= 11，而仓库 packageManager 仍是 10.x，
      # 待 pnpm 大版本迁移时与 packageManager 一起升级。
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml

      # 根目录检查（markdownlint + prettier）：靠 husky 本地钩子挡不住绕过钩子的提交，
      # 必须进 CI 才能真正拦住（web/AGENTS.md 的 MD025 曾因此溜进 main）。
      - name: Install root dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Markdown lint
        working-directory: .
        run: pnpm run lint:md

      - name: Format check
        working-directory: .
        run: pnpm run format:check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
