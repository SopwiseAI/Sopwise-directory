name: Web CI

# 注意：这里刻意不加 paths 过滤——main 已配置分支保护，要求 "ci" 检查通过才能合并，
# 如果只在 web/** 变更时运行，根目录/studio 的 PR 会永远等不到该检查而无法合并。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: web

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml

      # 根目录检查（markdownlint + prettier）：靠 husky 本地钩子挡不住绕过钩子的提交，
      # 必须进 CI 才能真正拦住（web/AGENTS.md 的 MD025 曾因此溜进 main）。
      - name: Install root dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Markdown lint
        working-directory: .
        run: pnpm run lint:md

      - name: Format check
        working-directory: .
        run: pnpm run format:check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
