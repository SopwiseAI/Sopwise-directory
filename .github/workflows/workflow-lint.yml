name: Workflow Lint

# 守住 workflow 自身的安全基线：
# - actionlint：workflow 语法 / action 输入 / run 里的 shell 片段（装了 shellcheck 才会检查 shell）
# - zizmor：workflow 安全审计（未固定引用、模板注入、凭证持久化等）
# 这两个工具让"按 SHA 固定"不靠人自觉：有人改回 tag、或 SHA 与注释不一致，这里会报出来。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint（语法与 shell）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 装 shellcheck 后 actionlint 会连带检查 run: 里的 shell 片段
      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      # 不用第三方 action：直接下载官方发布包并校验 sha256，避免"用可变引用去检查可变引用"
      - name: Run actionlint
        run: |
          set -euo pipefail
          VERSION="1.7.12"
          ARCHIVE="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${ARCHIVE}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${ARCHIVE}" | sha256sum -c -
          tar xzf "$ARCHIVE" actionlint
          ./actionlint -color

  zizmor:
    name: zizmor（workflow 安全审计）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # 固定 zizmor 版本，不跟随 latest
          version: "1.30.1"
          # 不写 SARIF：省掉 security-events: write，保持 contents: read 的最小权限
          advanced-security: false
          annotations: true
          # low 及以上都报（template-injection 属 low，但 confidence 高，值得拦住）
          min-severity: low
