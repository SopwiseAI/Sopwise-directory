name: Commit Lint

# 本地 husky 的 commit-msg 钩子可以被 --no-verify 或网页端提交绕过，
# 这里对 PR 区间内的提交信息做服务端兜底校验（规则见 commitlint.config.cjs）。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: commitlint（提交信息规范）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 需要完整历史才能按 base..head 区间校验提交信息
          fetch-depth: 0
          # 后续步骤只读本地 git 历史，不需要把 token 留在 .git/config（zizmor: artipacked）
          persist-credentials: false

      # v6 起要求 pnpm >= 11：仓库已迁移到 pnpm 12（见根 package.json 的 packageManager）
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      # 表达式先经 env 传入、脚本里只引用 shell 变量，避免 ${{ }} 直接内插进 run（zizmor: template-injection）
      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
