# gitleaks 配置：在官方默认规则之上，补本仓库特有的误报白名单。
# 用法（本地或 CI）：gitleaks git --redact -c .gitleaks.toml .      # 扫 git 历史（等价于旧的 detect）
#                   gitleaks dir --redact -c .gitleaks.toml .      # 扫工作目录（非 git 场景）
# 注意：detect / protect 自 v8.19.0 起已弃用（实测 v8.30.1 上仍可用，只是已从 --help 隐藏），
# 官方推荐 git / dir / stdin 三种模式。CI 使用 git 模式。
# 官方默认规则已忽略锁文件与二进制文件，此处只补仓库特有项。

# 与官方配置模板一致：低于该版本的 gitleaks 不保证支持本文件的全部特性
minVersion = "v8.25.0"

[extend]
useDefault = true

[allowlist]
description = "本仓库已确认的误报"
paths = [
  # 空值模板，不含真实凭据
  '''\.env\.example$''',
  # 目录索引数据（第三方产品名称 / URL / 描述），不含凭据
  '''web/data/data\.json$''',
]
regexes = [
  # studio 的开发占位密钥（非 dev 环境会被 config.py 拒绝，不是活凭据）
  '''dev-secret-key''',
]
