[project]
name = "studio"
version = "0.1.0"
description = "XiGee Studio — data management backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1,<1.0",
    "uvicorn[standard]>=0.54.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "aiomysql>=0.2.0,<1.0",
    # MySQL 8 的默认认证插件是 caching_sha2_password, 而 prod 库就是 8.0。
    # 非 TLS 连接下 caching_sha2 的 full auth 分支要用服务端公钥做 RSA 加密密码,
    # PyMySQL 只在装了 cryptography 时才实现它(见 pymysql/_auth.py 的 _have_cryptography)。
    # 缺了这行, prod 会在首次连接(以及 FLUSH PRIVILEGES / 服务端重启之后)抛
    # RuntimeError: 'cryptography' package is required ... —— 那既不是我们用
    # OperationalError 兜住的"库不可用", 也不是能重试的错误。
    # dev 库是 5.7(mysql_native_password), 本地测试永远走不到这条路径, 只能靠声明兜住。
    "cryptography>=44.0.0,<48.0",
    "pydantic>=2.0.0,<3.0",
    "pydantic-settings>=2.15.0,<3.0",
    "url-normalize>=3.0.1,<4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.1",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "C4", "RET", "SIM", "RUF", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "RUF002", "RUF003"]
"app/api/**" = ["B008"]
# 下面两处的 LOCAL_HOSTS 是【地址白名单】而不是监听地址,flake8-bandit 误报(S104)
"app/utils/url.py" = ["S104"]
"app/schemas/models.py" = ["S104"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/exporters/__main__.py", "tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70